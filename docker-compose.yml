# Mijoz serverida ishga tushirish:
#   cp .env.example .env   (parollarni o'zgartiring!)
#   docker compose up -d --build
# Tizim: http://SERVER_IP  (HTTPS uchun README ga qarang)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nasiya}
      POSTGRES_USER: ${DB_USER:-nasiya}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD ni .env da o'rnating}
      TZ: Asia/Tashkent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: nasiya-backend:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-nasiya}
      DB_USER: ${DB_USER:-nasiya}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET ni .env da o'rnating (kamida 32 belgi)}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost}
      APP_SMS_PROVIDER: ${APP_SMS_PROVIDER:-log}
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
      ESKIZ_FROM: ${ESKIZ_FROM:-4546}
      APP_TELEGRAM_BOT_TOKEN: ${APP_TELEGRAM_BOT_TOKEN:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    # Tashqariga ochilmaydi — faqat nginx orqali

  frontend:
    build: ./frontend
    image: nasiya-frontend:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"

  # Kunlik zaxira nusxa: ./backups papkasiga, 14 kun saqlanadi
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-nasiya}
      PGUSER: ${DB_USER:-nasiya}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Tashkent
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  pgdata:
