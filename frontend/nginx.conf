# Oldida yana bir proksi (serverdagi nginx/caddy, HTTPS) bo'lsa, uning sxemasini saqlaymiz
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # API -> backend konteyner
    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host portni ham saqlaydi (masalan :8090) — aks holda backend
        # bir xil origin'dagi so'rovni CORS deb rad etadi
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;
    }

    # Hash'langan statik fayllar uzoq keshlanadi
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: barcha yo'llar index.html ga
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
