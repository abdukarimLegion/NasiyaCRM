# Oldida yana bir proksi (serverdagi nginx/caddy, HTTPS) bo'lsa, uning sxemasini saqlaymiz
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Mijozning haqiqiy IP manzili. X-Forwarded-For ga faqat ishonchli proksidan (shu serverdagi
    # nginx/caddy — docker tarmog'i orqali keladi) kelganda ishoniladi; tashqaridan to'g'ridan-to'g'ri
    # kelgan so'rovda mijoz yuborgan sarlavha e'tiborga olinmaydi (login cheklovini aylanib o'tmaslik uchun).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # API -> backend konteyner
    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host portni ham saqlaydi (masalan :8090) — aks holda backend
        # bir xil origin'dagi so'rovni CORS deb rad etadi
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Faqat bitta, tekshirilgan manzil uzatiladi (mijoz yuborgan qiymat qo'shilmaydi)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;
    }

    # Hash'langan statik fayllar uzoq keshlanadi
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: barcha yo'llar index.html ga
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
