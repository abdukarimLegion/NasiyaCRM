server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: installment-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nasiya}
    username: ${DB_USER:nasiya}
    password: ${DB_PASSWORD:nasiya}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # sxemani faqat Flyway boshqaradi
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  task:
    scheduling:
      pool:
        size: 2

app:
  timezone: Asia/Tashkent
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  jwt:
    # Kamida 32 belgi. Prod'da .env orqali MAJBURIY beriladi.
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl-hours: ${APP_JWT_TTL_HOURS:12}
  bootstrap-admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}
  sms:
    provider: ${APP_SMS_PROVIDER:log}   # log | eskiz
    eskiz:
      base-url: https://notify.eskiz.uz/api
      email: ${ESKIZ_EMAIL:}
      password: ${ESKIZ_PASSWORD:}
      from: ${ESKIZ_FROM:4546}
  # MIB (Majburiy ijro byurosi) qarzdorligini JShShIR bo'yicha tekshirish
  mib:
    provider: ${APP_MIB_PROVIDER:none}          # none | stub | http
    url: ${APP_MIB_URL:}                        # masalan https://mib.example.uz/api/debts/{pinfl}
    method: ${APP_MIB_METHOD:GET}               # GET | POST
    token: ${APP_MIB_TOKEN:}
    auth-header: ${APP_MIB_AUTH_HEADER:Authorization}
    auth-scheme: ${APP_MIB_AUTH_SCHEME:Bearer}  # bo'sh qoldirilsa token to'g'ridan-to'g'ri yuboriladi
    timeout-seconds: ${APP_MIB_TIMEOUT:10}
    debt-flag-path: ${APP_MIB_DEBT_FLAG_PATH:}  # javobdagi boolean (masalan data.hasDebt)
    amount-path: ${APP_MIB_AMOUNT_PATH:}        # javobdagi jami qarz summasi (masalan data.totalDebt)
    cases-path: ${APP_MIB_CASES_PATH:}          # javobdagi ijro ishlari massivi (masalan data.cases)
    message-path: ${APP_MIB_MESSAGE_PATH:}
    not-found-means-clear: ${APP_MIB_NOT_FOUND_CLEAR:true}  # 404 — mijoz bo'yicha ijro ishi yo'q
  telegram:
    bot-token: ${APP_TELEGRAM_BOT_TOKEN:}   # bo'sh bo'lsa Telegram xabarlari o'chiq
  jobs:
    # Har kuni 09:00 (Toshkent) — kechikishlarni yangilash va eslatmalar
    daily-cron: ${APP_DAILY_CRON:0 0 9 * * *}

springdoc:
  # Hujjatlar prod'da o'chirilgan — faqat dev profilida yoqiladi.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /api/docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/demo
    # dev'da yuklangan demo migratsiya (V100) prod'da topilmasa xato bermasin
    ignore-migration-patterns: "*:missing"
    # demo migratsiyalari (V100+) allaqachon qo'llangan bazada yangi V6, V7... ham ishlashi uchun
    out-of-order: true
  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  mib:
    provider: ${APP_MIB_PROVIDER:stub}
  bootstrap-admin:
    password: ${APP_ADMIN_PASSWORD:admin123}
