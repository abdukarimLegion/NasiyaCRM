name: Deploy

# Qo'lda ishga tushiriladi yoki v* tegi qo'yilganda.
# Mijoz serveriga chiqadi, shuning uchun har push'da avtomatik ishlamaydi.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.names.outputs.backend }}
      frontend: ${{ steps.names.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Image nomlari
        id: names
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=$REGISTRY/$repo-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend=$REGISTRY/$repo-frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.names.outputs.backend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.names.outputs.frontend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: SSH kalitni sozlash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Compose fayllarini serverga ko'chirish
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          path="${DEPLOY_PATH:-/opt/nasiya}"
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$path/deploy' '$path/backups'"
          scp -i ~/.ssh/id_deploy -P "${SSH_PORT:-22}" \
            docker-compose.prod.yml "$SSH_USER@$SSH_HOST:$path/"
          scp -i ~/.ssh/id_deploy -P "${SSH_PORT:-22}" \
            deploy/backup.sh deploy/restore.sh "$SSH_USER@$SSH_HOST:$path/deploy/"

      - name: Image'larni tortib, qayta ishga tushirish
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BACKEND_IMAGE: ${{ needs.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ needs.images.outputs.frontend }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          path="${DEPLOY_PATH:-/opt/nasiya}"
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" \
            GHCR_TOKEN="$GHCR_TOKEN" GHCR_USER="${{ github.actor }}" DEPLOY_PATH="$path" \
            'bash -euo pipefail -s' <<'REMOTE'
          cd "$DEPLOY_PATH"
          test -f .env || { echo ".env topilmadi: $DEPLOY_PATH/.env ni yarating"; exit 1; }
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          export BACKEND_IMAGE FRONTEND_IMAGE
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker logout ghcr.io
          docker image prune -f
          REMOTE

      - name: Sog'lomlik tekshiruvi
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          path="${DEPLOY_PATH:-/opt/nasiya}"
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            DEPLOY_PATH="$path" 'bash -euo pipefail -s' <<'REMOTE'
          cd "$DEPLOY_PATH"
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml exec -T backend \
                 sh -c 'curl -fsS http://localhost:8080/actuator/health' | grep -q '"status":"UP"'; then
              echo "Backend UP"; exit 0
            fi
            sleep 5
          done
          echo "Backend 150 soniyada ko'tarilmadi:"
          docker compose -f docker-compose.prod.yml logs --tail 60 backend
          exit 1
          REMOTE
