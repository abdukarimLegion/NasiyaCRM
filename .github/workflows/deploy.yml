name: Deploy

# master (yoki main) ga push bo'lganda: testlar -> image'lar ghcr.io ga -> VPS da yangilash.
# Qo'lda ham ishga tushirish mumkin (Actions -> Deploy -> Run workflow).
on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Bir vaqtda faqat bitta deploy; navbatdagisi oldingisini bekor qilmaydi.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.names.outputs.backend }}
      frontend: ${{ steps.names.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Image nomlari
        id: names
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=$REGISTRY/$repo-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend=$REGISTRY/$repo-frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.names.outputs.backend }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.names.outputs.frontend }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      SSHPASS: ${{ secrets.VPS_PASSWORD }}   # sshpass -e shu o'zgaruvchidan o'qiydi
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/nasiya' }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH (parol bilan) sozlash
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$SSHPASS" \
            || { echo "VPS_HOST / VPS_USER / VPS_PASSWORD secret'lari berilmagan"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            PubkeyAuthentication no
            PreferredAuthentications password,keyboard-interactive
            ServerAliveInterval 30
          EOF
          sshpass -e ssh vps 'docker --version && docker compose version'

      - name: Fayllarni serverga ko'chirish
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          sshpass -e ssh vps "mkdir -p '$DEPLOY_PATH/deploy' '$DEPLOY_PATH/backups'"
          sshpass -e scp docker-compose.prod.yml "vps:$DEPLOY_PATH/"
          sshpass -e scp deploy/backup.sh deploy/restore.sh deploy/remote-deploy.sh "vps:$DEPLOY_PATH/deploy/"
          # ENV_FILE secret berilgan bo'lsa, serverdagi .env shu bilan almashtiriladi
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" | sshpass -e ssh vps \
              "umask 077 && cat > '$DEPLOY_PATH/.env.tmp' && mv '$DEPLOY_PATH/.env.tmp' '$DEPLOY_PATH/.env'"
            echo ".env ENV_FILE secret'idan yangilandi"
          fi

      - name: Yangilash va sog'lomlik tekshiruvi
        env:
          BACKEND_IMAGE: ${{ needs.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ needs.images.outputs.frontend }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | sshpass -e ssh vps \
            "DEPLOY_PATH=$(printf %q "$DEPLOY_PATH") \
             BACKEND_IMAGE=$(printf %q "$BACKEND_IMAGE") \
             FRONTEND_IMAGE=$(printf %q "$FRONTEND_IMAGE") \
             GHCR_USER=$(printf %q "${{ github.actor }}") \
             bash $(printf %q "$DEPLOY_PATH/deploy/remote-deploy.sh")"
