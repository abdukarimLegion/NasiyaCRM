name: Preview build (vaqtinchalik)

# Faqat ish branchida: frontendni yig'ib, dist'ni logga chiqaradi (vizual tekshiruv uchun).
# main ga merge qilishdan oldin o'chiriladi.
on:
  push:
    branches: ['claude/**']

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: dist -> log
        run: |
          tar czf /tmp/dist.tgz -C dist .
          ls -la /tmp/dist.tgz
          base64 -w 2000 /tmp/dist.tgz | sed 's/^/B64:/'
          echo "B64-END"
