name: Preview build (vaqtinchalik)

# Faqat ish branchida: frontendni yig'ib, dist'ni yashirin refs/preview/dist ref'iga yozadi
# (vizual tekshiruv uchun; branch emas, UI'da ko'rinmaydi). main ga merge qilishdan oldin o'chiriladi.
on:
  push:
    branches: ['claude/**']

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build va testlar
        working-directory: backend
        run: ./gradlew build --no-daemon

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: dist -> refs/preview/dist
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init -q
          git add -A
          git -c user.name=preview -c user.email=preview@localhost commit -qm "preview ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/preview/dist
