name: CI

# master/main ga push bo'lganda CI deploy.yml ichidan chaqiriladi (ikki marta ishlamasligi uchun).
on:
  pull_request:
    branches: [master, main]
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build va testlar
        working-directory: backend
        run: ./gradlew build --no-daemon

      - name: Test natijalari
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Backend'ni haqiqiy PostgreSQL bilan ishga tushirib, demo ma'lumot yuklab, API'larni chaqiradi
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nasiya
          POSTGRES_USER: nasiya
          POSTGRES_PASSWORD: nasiya
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nasiya" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: nasiya
      PGPASSWORD: nasiya
      PGDATABASE: nasiya
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: bootJar
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -q
      - name: Backend'ni ishga tushirish
        env:
          DB_URL: jdbc:postgresql://localhost:5432/nasiya
          DB_USER: nasiya
          DB_PASSWORD: nasiya
          APP_JWT_SECRET: smoke-test-secret-smoke-test-secret-smoke-test-secret
          APP_ADMIN_USERNAME: admin
          APP_ADMIN_PASSWORD: smoke12345
        run: |
          nohup java -jar backend/build/libs/installment-platform-*.jar > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS localhost:8080/actuator/health >/dev/null 2>&1 && { echo "UP"; exit 0; }
            sleep 2
          done
          tail -n 120 /tmp/app.log; exit 1
      - name: Demo ma'lumot va API tekshiruvi
        run: |
          psql -v ON_ERROR_STOP=1 -q -f deploy/seed/demo_seed.sql
          TOKEN=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"admin","password":"smoke12345"}' \
            localhost:8080/api/auth/login | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          fail=0
          check() {
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$@")
            echo "$code $*  $(head -c 300 /tmp/r.json)"
            case "$code" in 2*) ;; *) fail=1 ;; esac
          }
          check localhost:8080/api/dashboard
          check "localhost:8080/api/contracts?open=true&size=5"
          check "localhost:8080/api/contracts?q=998&size=5"
          check "localhost:8080/api/contracts?status=LATE&size=5"
          CID=$(curl -fsS -H "Authorization: Bearer $TOKEN" "localhost:8080/api/contracts?open=true&size=1" | python3 -c 'import sys,json;print(json.load(sys.stdin)["content"][0]["id"])')
          check localhost:8080/api/contracts/$CID
          check "localhost:8080/api/payments?size=5"
          check localhost:8080/api/collection/overdue
          check "localhost:8080/api/clients?size=5"
          check "localhost:8080/api/clients?q=998&size=5"
          check localhost:8080/api/clients/summary
          CLID=$(curl -fsS -H "Authorization: Bearer $TOKEN" "localhost:8080/api/clients?size=1" | python3 -c 'import sys,json;print(json.load(sys.stdin)["content"][0]["id"])')
          check "localhost:8080/api/clients/$CLID/limit?risk=A"
          check localhost:8080/api/clients/$CLID
          check "localhost:8080/api/contracts?risk=A&size=3"
          check localhost:8080/api/products
          check -X POST -H 'Content-Type: application/json' -d "{\"contractId\":$CID,\"amount\":1000,\"method\":\"CASH\"}" localhost:8080/api/payments
          check -X POST -H 'Content-Type: application/json' -d '{"text":"Smoke test SMS"}' localhost:8080/api/collection/contracts/$CID/sms
          check localhost:8080/api/collection/contracts/$CID/actions
          if [ "$fail" != 0 ]; then tail -n 80 /tmp/app.log; exit 1; fi
